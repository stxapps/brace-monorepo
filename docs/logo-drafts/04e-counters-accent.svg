<!-- 04e — 04b's GEOMETRY, 04d's COLOUR. The recommendation.
     04b is the only study whose letter survives 16px, and downscaling the
     reference screenshot to 16px shows why colour is worth spending there:
     its page lines and its swallowtail are gone at that size but the coloured
     ribbon is still unmistakable. Colour is the one attribute that does not
     degrade with resolution — provided it actually contrasts with the mark it
     sits in, which is why this is orange-400 and not the site's petrol. See
     the ACCENT note at the top of build-04.js.
     Same trade as 04d, and it is a real one: two colours, one of them fixed,
     so this is no longer a single currentColor path. It will need a token pair
     back in styles.css and it will not compose on an arbitrary surface — read
     the header of packages/web-ui/src/components/icons/bracemark-icon.tsx,
     which explains why the last pair was deleted. -->
