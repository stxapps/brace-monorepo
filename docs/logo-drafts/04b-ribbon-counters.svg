<!-- 04b — RIBBON AS COUNTER, PLUS A LOWER COUNTER. The one study here that
     edits the B, because the ribbon alone cannot carry the letter: a B needs
     two counters and draft1/draft2 have none, which is why they go to a solid
     blob when you shrink them. On the 16px row this is the only one of the
     five still legible as a letter.
     The ribbon is 167 × 315 (1:1.9) with a 110-deep swallowtail (35%) — wide
     enough to sit where the upper counter belongs and do that job as well as
     its own, long enough to still read as a ribbon. A stadium counter opens
     the lower bowl; its left edge is aligned with the ribbon's at x=178 so the
     stem holds one width down the whole letter, and the bars around it come
     out 75 top / 82 right / 80 bottom, near enough even. -->
