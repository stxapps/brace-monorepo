     screenshot: ribbon in the upper bowl, the stacked page edges of a book in
     the lower one. Worth seeing because the page lines are doing a counter's
     job — they are the reason the reference does not read as a blob even
     though its B, like draft2's, has no counters.
     They are interior detail rather than silhouette, so they are the first
     thing to go when it shrinks. That is the trade the 16px row prices. -->
